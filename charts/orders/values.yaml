# Defaults. Environment-specific values live in envs/<env>/values-orders.yaml

image:
  registry: 717279721195.dkr.ecr.us-east-1.amazonaws.com
  tag: "" # REQUIRED: git SHA from shipyard-apps CI
  pullPolicy: IfNotPresent

aws:
  region: us-east-1

queue:
  url: "" # REQUIRED

database:
  sslMode: require
  secretName: orders-db # Kubernetes Secret the pods read (created by External Secrets)
  secretStore: aws-secrets-manager # ClusterSecretStore name (see platform/)
  awsSecretName: "" # REQUIRED: Secrets Manager name holding host/port/dbname/username/password

api:
  replicas: 2
  serviceAccountName: orders-api # must match the Pod Identity association in Terraform
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

worker:
  replicas: 2
  serviceAccountName: orders-worker # must match the Pod Identity association in Terraform
  processingMs: 500
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

web:
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
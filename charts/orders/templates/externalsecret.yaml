# Pulls the JSON secret from AWS Secrets Manager and creates the "orders-db" Kubernetes Secret
# with keys host, port, dbname, username, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # create the Secret before the Deployments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.database.secretStore }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "database.awsSecretName is required" .Values.database.awsSecretName }}
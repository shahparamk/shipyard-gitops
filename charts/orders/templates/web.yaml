apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-web
  labels:
    app.kubernetes.io/name: orders-web
    {{- include "orders.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-web
        {{- include "orders.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false # static site; never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged's numeric user
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-web
      containers:
        - name: web
          image: {{ include "orders.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "orders.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp # nginx-unprivileged keeps its pid and temp files here
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-web
  labels:
    app.kubernetes.io/name: orders-web
    {{- include "orders.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-web
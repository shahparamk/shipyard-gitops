{{- if .Values.api.autoscaling.enabled }}
# Scales the API on CPU. Requires metrics-server (EKS add-on).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
  labels:
    {{- include "orders.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react to load immediately
    scaleDown:
      stabilizationWindowSeconds: 60 # wait 1 minute of low load before removing pods (default is 5)
{{- end }}
# Pod Identity maps these exact names (in namespace "shipyard") to IAM roles
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccountName }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccountName }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
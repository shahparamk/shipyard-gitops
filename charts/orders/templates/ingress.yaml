{{- if .Values.ingress.enabled }}
# One public HTTPS entry point: the AWS Load Balancer Controller builds an ALB from this,
# and ExternalDNS points the hostname at it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders
  labels:
    {{- include "orders.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # route straight to pod IPs (VPC CNI)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443" # HTTP always redirects to HTTPS
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required" .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06 # TLS 1.2+ only
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/tags: Project=shipyard,Environment=dev
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-web
                port:
                  name: http
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.3.1 # pinned (2-week rule); this chart releases several times a week
    helm:
      valuesObject:
        # EKS manages the control plane, so these components can't be scraped.
        # Disabling them prevents permanently-firing "...Down" alerts.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false # EKS kube-proxy exposes metrics only on localhost

        # Admission webhook + operator TLS, with certificates issued by cert-manager
        # (no more Helm hook job that Argo re-runs on every sync, which drifted on Days 9-10)
        prometheusOperator:
          admissionWebhooks:
            enabled: true
            certManager:
              enabled: true
          tls:
            enabled: true

        prometheus:
          prometheusSpec:
            retention: 6h # data is wiped at every teardown anyway; less retention = less memory
            # Pick up PodMonitors / PrometheusRules from ANY release (e.g. the orders chart),
            # not only ones labeled with this Helm release
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi

        grafana:
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL # load dashboards shipped by any chart
          # Loki as a second data source, next to Prometheus
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki # fixed uid so dashboards can reference it
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # cert-manager's CA injector writes caBundle into the operator's webhooks after Argo applies them
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the Prometheus Operator CRDs are too large for client-side apply
      - RespectIgnoreDifferences=true
    # On a fresh cluster, cert-manager's CRDs may not exist yet when this app first syncs
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
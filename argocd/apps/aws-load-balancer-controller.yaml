apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.0 # pinned; matches the vendored IAM policy in shipyard-infra
    helm:
      valuesObject:
        clusterName: shipyard-dev
        region: us-east-1
        vpcId: vpc-06bfd32f2870bac2c
        serviceAccount:
          create: true
          name: aws-load-balancer-controller # must match the Pod Identity association
        # This webhook intercepts EVERY Service in the cluster. We only use Ingress -> ALB,
        # so turn it off to remove that blast radius.
        enableServiceMutatorWebhook: false
        # The webhook TLS cert is issued ONCE by cert-manager instead of being generated on
        # every chart render (which drifted under Argo on Days 9 and 10).
        enableCertManager: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # cert-manager's CA injector writes caBundle into the webhooks after Argo applies them,
  # so Argo must leave that one field alone. (The Secret is no longer rendered by the chart.)
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # its CRDs are large
      - RespectIgnoreDifferences=true
    # On a fresh cluster, cert-manager's CRDs may not exist yet when this app first syncs
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
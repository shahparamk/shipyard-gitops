apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.1 # pinned (2-week rule)
    helm:
      valuesObject:
        controller:
          type: deployment # one collector reading logs via the Kubernetes API (no hostPath, no DaemonSet)
          replicas: 1
        alloy:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              // Find every pod in the cluster
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Turn Kubernetes metadata into a few low-cardinality Loki labels
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
              }

              // Stream container logs through the Kubernetes API
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.json.receiver]
              }

              // Our apps log JSON: promote "level" and "service" to labels.
              // High-cardinality fields like orderId stay in the log line (query them with | json).
              loki.process "json" {
                stage.json {
                  expressions = { level = "level", service = "service" }
                }
                stage.labels {
                  values = { level = "", service = "" }
                }
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true